name: CI

on:
  # 只在分支上跑；tag 由 release.yml 负责（它内部也会先跑测试）
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: 编译应用二进制（不做 GUI 安装）
        run: swiftc -O src/*.swift -o /tmp/ai-launcher

      - name: 运行 Core 逻辑层测试
        run: |
          chmod +x scripts/test.sh
          # --core-only：界面接线由下一步单独校验，避免同一项检查跑两遍
          out=$(./scripts/test.sh --core-only 2>&1)
          echo "$out"
          n=$(printf '%s\n' "$out" | sed -nE 's/.*测试汇总：([0-9]+) 通过.*/\1/p' | tail -1)
          echo "ASSERT_COUNT=$n" >> "$GITHUB_ENV"

      # 界面控件必须真的接到行为上：只创建 / 只回显 / 只在快照里搬运的控件判失败。
      # 单独列一步，让「新增控件忘了接线」在 CI 里一眼可见。
      - name: 校验界面控件接线
        run: |
          chmod +x scripts/check-ui-wiring.sh
          ./scripts/check-ui-wiring.sh

      # 示例配置与代码默认值曾是两份手写文件，已漂移过一次（示例多一个 omp）。
      - name: 校验示例配置与默认值一致
        run: |
          chmod +x scripts/sync-config-example.sh
          ./scripts/sync-config-example.sh --check

      # 文档与代码的一致性：版本号、断言数、断言数唯一性。
      # 2026-11-02 文档被整批回退到旧版（净少 490 行）却没人发现，这条用于兜住同类问题。
      - name: 校验文档与代码一致
        run: |
          chmod +x scripts/check-docs.sh
          ./scripts/check-docs.sh --assert-count "$ASSERT_COUNT"
